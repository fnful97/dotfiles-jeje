[main]
font=Gallant12:size=12:antialias=false
dpi-aware=no
pad=8x8
selection-target=clipboard

[cursor]
style=block
blink=no

[mouse]
hide-when-typing=yes

[colors-dark]
cursor=050303 d0758b
background=050303
foreground=c1b48e

# Normal colors
regular0=1a0a0c    # black -> deep void shadow
regular1=8a1f2f    # red -> deep ember
regular2=6b4a2c    # green -> substituted with rust/root brown (no green in source)
regular3=8a6f5a    # yellow -> muted dry khaki
regular4=4a3a42    # blue -> substituted with dusty plum (no blue in source)
regular5=8a4a56    # magenta -> muted rose
regular6=4f6b62    # cyan -> substituted with dim teal accent
regular7=c1b48e    # white -> cream

# Bright colors
bright0=3a1f22     # black -> lighter maroon-black
bright1=ff4d6d     # red -> bright ember/alert
bright2=a8724a     # green -> lighter root brown
bright3=e89aad     # yellow -> substituted with light rose accent
bright4=6b5a66     # blue -> lighter dusty plum
bright5=d0758b     # magenta -> the wallpaper's glowing rose (accent)
bright6=6ea896     # cyan -> kept as the one contrast accent
bright7=f0e8d0     # white -> bright cream

[csd]
size=0
border-width=0

[key-bindings]
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
