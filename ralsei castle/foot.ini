[main]
shell=bash
title=foot
font=Terminus:size=18
letter-spacing=0
dpi-aware=no
pad=25x25
bold-text-in-bright=no
gamma-correct-blending=no

[scrollback]
lines=10000

[cursor]
style=beam
beam-thickness=1.5

[colors-dark]
alpha=0.85
background=f4f2ec
foreground=2b2b2b

regular0=1a1a1a
regular1=c0392b
regular2=8bb174
regular3=d4a24c
regular4=8a7a9b
regular5=e85c5c
regular6=7a9ba0
regular7=eee0d0

bright0=3a2a2a
bright1=e85c5c
bright2=a3c98a
bright3=e8c07d
bright4=a897c0
bright5=ff8080
bright6=9bc4c9
bright7=f5e6d3

[key-bindings]
scrollback-up-page=Page_Up
scrollback-down-page=Page_Down
search-start=Control+Shift+f

[search-bindings]
cancel=Escape
find-prev=Shift+F3
find-next=F3 Control+G
