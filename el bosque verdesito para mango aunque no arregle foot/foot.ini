[main]
font=Gallant12:size=12:antialias=false
dpi-aware=no
pad=8x8
selection-target=clipboard

[cursor]
style=block
blink=no
color=201b14 c99a4c

[mouse]
hide-when-typing=yes

[colors]
background=0c1208
foreground=d9cfa8

# Normal colors
regular0=1a2110    # black -> deep moss shadow
regular1=8a4a3a    # red -> rust/reed
regular2=6b7d4a    # green -> moss
regular3=a8863f    # yellow -> dry gold
regular4=4a5c6b    # blue -> water shadow
regular5=8a6f3a    # magenta -> muted olive-gold (kept desaturated, no pink)
regular6=4f7d6e    # cyan -> lily-pad teal
regular7=d9cfa8    # white -> cream

# Bright colors
bright0=3a4a2e     # black -> lighter moss
bright1=c9704f     # red
bright2=8fae5a     # green
bright3=c99a4c     # yellow -> dock-light gold (accent)
bright4=6b8ba0     # blue
bright5=a88a52     # magenta
bright6=6ea896     # cyan
bright7=f0e8d0     # white

[csd]
size=0
border-width=0

[key-bindings]
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
